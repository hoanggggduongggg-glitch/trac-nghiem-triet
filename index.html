<style>

*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh}

<script>
const Q=[{"n":1,"q":"Triết học ra đời từ những nguồn gốc nào?","o":["Tự nhiên và Xã hội","Nhận thức và Xã hội","Con người và tự nhiên","Tự nhiên, Xã hội và Tư duy"],"a":1},{"n":2,"q":"Chức năng của triết học","o":["Thế giới quan và phương pháp luận","Thế giới quan và nhận thức luận","Tư duy lí luận","Lý luận thực tiễn"],"a":0},{"n":3,"q":"Hai phạm trù rộng lớn nhất của triết học","o":["Duy vật, duy tâm","Tự nhiên và xã hội","Vật chất và ý thức","Trời và đất"],"a":2},{"n":4,"q":"Vấn đề cơ bản của triết học","o":["Duy vật và ý thức","Duy vật và duy tâm","Mối quan hệ giữa vật chất và ý thức hay mối quan hệ giữa tư duy và tồn tại","Mối quan hệ con người và xã hội"],"a":2},{"n":5,"q":"Theo quan niệm triết học Mác - Lênin, thế giới thống nhất ở tính nào ?","o":["Tính hiện thực","Tính vật chất","Tính tồn tại","Tính khách quan"],"a":1},{"n":6,"q":"Hãy sắp xếp theo trình tự xuất hiện từ sớm nhất đến muộn nhất các hình thức thế giới quan sau:","o":["Tôn giáo - thần thoại - triết học","Thần thoại - tôn giáo - triết học","Triết học - tôn giáo - thần thoại","Thần thoại - triết học - tôn giáo"],"a":1},{"n":7,"q":"Đối tượng nghiên cứu của triết học bao gồm","o":["Toàn bộ thế giới vật chất","Toàn bộ thế giới tự nhiên","Tự nhiên và con người","Tự nhiên, xã hội và tư duy"],"a":3},{"n":8,"q":"Điều kiện lịch sử cho sự ra đời của triết học Mác","o":["Điều kiện KT - XH, nguồn gốc lý luận, tiền đề KH - TN, nhân tố chủ quan","Điều kiện KT - XH, điều kiện xã hội, tiền đề lý luận","Điều kiện KT - XH, nhân tố chủ quan, tiền đề KH - TN","Tiền đề KH - TN, điều kiện xã hội, nhân tố chủ quan"],"a":0},{"n":9,"q":"C.Mác chỉ ra đâu là hạt nhân hợp lý trong triết học của Hêghen","o":["Chủ nghĩa duy vật","Chủ nghĩa duy tâm","Phép biện chứng","Tư tưởng về vận động"],"a":2},{"n":10,"q":"Phoiơbắc là nhà triết học theo trường phái nào","o":["Duy tâm khách quan","Duy tâm chủ quan","Duy vật biện chứng","Duy vật siêu hình"],"a":3},{"n":11,"q":"Hêghen là nhà triết học theo trường phái nào","o":["Duy tâm chủ quan","Duy tâm khách quan","Duy vật siêu hình","Duy vật biện chứng"],"a":1},{"n":12,"q":"Triết học Mác ra đời vào thập niên nào của thế kỷ XIX?","o":["Những năm 20","Những năm 30","Những năm 40","Những năm 50"],"a":2},{"n":13,"q":"Triết học Mác _ Lênin do ai sáng lập và phát triển","o":["C.Mác, Ph.Ăngghen, V.I.Lênin","C.Mác, Ph.Ăngghen, Hêghen","Ph.Ăngghen, V.I.Lênin, Phoiơbắc","Ph.Ăngghen, V.I.Lênin, Hêghen"],"a":0},{"n":14,"q":"Ba phát minh lớn làm tiền đề KH -TN cho sự ra đời của triết học","o":["Thuyết mặt trời làm trung tâm vũ trụ của Côpecnich, định luật bảo toàn khối lượng của Lomônôxốp, học thuyết tế bào","Định luật bảo toàn và chuyển hoá năng lượng, học thuyết tế bào, học thuyết tiến hoá của Đác-uyn","Phát hiện ra nguyên tử, phát hiện ra điện tử, định luật bảo toàn và chuyển hoá năng lượng","Phát hiện ra nguyên tử, phát hiện ra điện tử, học thuyết tế bào"],"a":1},{"n":15,"q":"Phát minh nào trong KH - TN nửa đầu thế kỷ XIX vạch ra nguồn gốc tự nhiên của con người, chống lại quan điểm tôn giáo","o":["Học thuyết tế bào","Học thuyết tiến hoá của Đác - uyn","Định luật bảo toàn và chuyển hoá năng lượng","Thuyết duy nghiệm"],"a":1},{"n":16,"q":"Vai trò của ý thức đối với vật chất","o":["Ý thức có tính độc lập tương đối và tác động trở lại vật chất thông qua hoạt động thực tiễn theo hai hướng tích cực và tiêu cực","Ý thức có tính độc lập tuyệt đối và tác động trở lại vật chất thông qua hoạt động thực tiễn theo hai hướng tích cực và tiêu cực","Ý thức có tính độc lập và tác động trở lại vật chất thông qua hoạt động thực tiễn theo hướng tích cực","Tất cả đếu sai"],"a":0},{"n":17,"q":"Biện chứng là:","o":["Quan điểm, phương pháp xem xét: \" những sự vật và những phản ánh của chúng trong tư tưởng trong mối quan hệ qua lại lẫn nhau của chúng, trong sự ràng buộc, sự vận động, sự phát sinh và tiêu vong của chúng.\"","Quan điểm: \" xem xét sự vật và phản ánh của chúng trong mối quan hệ qua lại lẫn nhau của chúng, trong sự ràng buộc, sự vận động, sự phát sinh và tiêu vong của chúng.\"","Phương pháp xem xét sự vật, sự việc, hiện tượng và phản ánh của chúng trong mối quan hệ qua lại lẫn nhau của chúng, trong sự ràng buộc, sự vận động, sự phát sinh và tiêu vong của chúng","Tất cả a,b,c đều đúng"],"a":3},{"n":18,"q":"Xem xét sự vật, sự việc theo quan điểm toàn diện yêu cầu chúng ta phải như thế nào ?","o":["Không cần xem xét mối liên hệ","Chỉ xem xét một hoặc vài mối liên hệ","Phải xem xét tất cả các mối liên hệ của sự vật","Phải xem xét tất cả các mối liên hệ đồng thời phân loại được vị trí, vai trò của các mối liên hệ"],"a":3},{"n":19,"q":"Biện chứng bao gồm:","o":["Biện chứng khách quan và biện chứng chủ quan","Biện chứng duy vật và biện chứng duy tâm","Cả a,b đều đúng","Cả a,b đều sai"],"a":2},{"n":20,"q":"Mối liên hệ là:","o":["Một phạm trù triết học dùng để chỉ các mối ràng buộc tương hỗ, quy định và ảnh hưởng lẫn nhau giữa các yếu tố, bộ phận trong một đối tượng hoặc giữa các đối tượng với nhau","Một phạm trù triết học dùng để chỉ các mối ràng buộc tương hỗ, quy định và ảnh hưởng lẫn nhau giữa các yếu tố, bộ phận trong một đối tượng","Cả a,b đều đúng","Cả a,b đều sai"],"a":0},{"n":21,"q":"Chọn đáp án đúng nhất theo quan điểm của chủ nghĩa duy vật biện chứng về mối liên hệ ?","o":["Mối liên hệ chỉ diễn ra giữa các sự vật với nhau còn trong bản thân sự vật không có sự liên hệ","Mối liên hệ của sự vật chỉ do ý chí con người tạo ra còn bản thân sự vật không có sự liên hệ","Mối liên hệ không chỉ diễn ra giữa các sự vật mà còn diễn ra ngay bên trong mỗi sự vật","Tất a,b,c đều sai"],"a":2},{"n":22,"q":"Tính chất của mối liên hệ phổ biến gồm:","o":["Tính khách quan, tính phổ quát, tính đa dạng - phong phú","Tính khách quan, tính phổ biến, tính đa dạng - phong phú","Tính khách quan, tính phổ rộng, tính đa dạng - phong phú","Cả a,b,c đều sai"],"a":1},{"n":23,"q":"Phát triển là","o":["Quá trình vận động từ thấp đến cao, từ kém hoàn thiện đến hoàn thiện hơn, từ chất cũ đến chất mới ở trình độ cao","Quá trình tiến hoá từ thấp đến cao, từ kém hoàn  pháp khắ phục để kết quả ngày càng tốt hơn hoàn thiện hơn","Nhìn nhận vấn đề ấu trĩ,đánh giá chưa đúng, thậm chí sai bản chất vấn đề","Nhìn nhận vấn đề khách quan hơn, đánh giá được một mặt của vấn đề, tránh rơi vào sai lầm, hạn chê tối đa rủi ro, Từ đó sẽ có giải pháp khắ phục để kết quả ngày càng tốt hơn hoàn thiện hơn","Cả a,b,c đều sai"],"a":0},{"n":199,"q":"Vận dụng quan điểm toàn diện, quan điểm lịch sử cụ thể để nhận xét, đánh giá kết quả công việc của một người, tránh rơi vào phiến diện thì cần phải:","o":["Không chỉ dựa trên kết quả cuối cùng để đánh giá mà còn phải thấy được kết quả từng giai đoạn, thời điểm người đó thực hiện để co sự thưởng phạt, phân minh cho phù hợp","Chỉ dựa vào kết quả cuối cùng, phủ nhận kết quả của từng giai đoạn, quá trình thực hiện của người đó","Chỉ căn cứ vào kết quả cuối cũng để quy kết hay phán quyết","Cả a,b,c đều sai"],"a":0}];
const $=s=>document.querySelector(s),app=$('#app');
let list,i,score,streak,wrong,done;
function shuf(a){a=[...a];for(let k=a.length-1;k>0;k--){const j=Math.random()*(k+1)|0;[a[k],a[j]]=[a[j],a[k]]}return a}
function home(){
 $('#sc').classList.add('hide');$('#st').classList.add('hide');
 app.innerHTML=`<div class="card"><h1>Ôn tập trắc nghiệm</h1><p class="mut">${Q.length} câu • Chọn đáp án là biết đúng/sai ngay • Cuối bài chấm điểm thang 10</p>
 <label>Số câu: <select id="n"><option value="${Q.length}">Tất cả (${Q.length})</option><option value="20">20 câu</option><option value="50">50 câu</option><option value="100">100 câu</option></select></label>
 <label><input type="checkbox" id="sh" checked> Xáo trộn thứ tự câu hỏi</label>
 <label><input type="checkbox" id="so" checked> Xáo trộn đáp án</label>
 <div class="row"><button class="btn" id="go">Bắt đầu ▶</button></div></div>`;
 $('#go').onclick=()=>start(Q,+$('#n').value,$('#sh').checked,$('#so').checked);
}
function start(src,n,sh,so){
 let l=sh?shuf(src):[...src];l=l.slice(0,n);
 const ref=/đều (đúng|sai|chưa)|a\s*,\s*b|ý trên|phương án trên/i;list=l.map(q=>{let idx=[0,1,2,3];if(so&&!q.o.some(t=>ref.test(t)))idx=shuf(idx);return{n:q.n,q:q.q,e:q.e,o:idx.map(k=>q.o[k]),a:idx.indexOf(q.a)}});
 i=0;score=0;streak=0;wrong=[];done=false;$('#sc').classList.remove('hide');$('#st').classList.remove('hide');show();
}
function show(){
 const q=list[i];$('#sc').textContent='✔ '+score;$('#st').textContent='🔥 '+streak;
 app.innerHTML=`<div class="bar"><i style="width:${i/list.length*100}%"></i></div><div class="card"><div class="qn">Câu ${i+1} / ${list.length} <span style="opacity:.6">(gốc #${q.n})</span></div><div class="q">${q.q}</div>
 <div class="opts">${q.o.map((t,k)=>`<button class="o" data-k="${k}"><b>${'ABCD'[k]}</b><span>${t}</span></button>`).join('')}</div>
 <div class="fb" id="fb"></div><div class="row hide" id="nx"><button class="btn" id="nb">${i+1<list.length?'Câu tiếp ▶':'Xem kết quả 🏁'}</button></div></div>`;
 done=false;document.querySelectorAll('.o').forEach(b=>b.onclick=()=>pick(+b.dataset.k));
}
function pick(k){
 if(done)return;done=true;const q=list[i],bs=document.querySelectorAll('.o'),fb=$('#fb');
 bs.forEach(b=>b.disabled=true);bs[q.a].classList.add('ok');
 if(k===q.a){score++;streak++;fb.className='fb ok';fb.textContent='✅ Chính xác!'+(streak>=3?' 🔥 '+streak+' câu liên tiếp':'');if(q.e){fb.textContent+='\n💡 '+q.e}}
 else{streak=0;wrong.push({q,k});bs[k].classList.add('no');fb.className='fb no';fb.textContent='❌ Sai rồi! Đáp án đúng: '+'ABCD'[q.a]}
 if(q.e)fb.textContent+='\n💡 '+q.e;
 $('#sc').textContent='✔ '+score;$('#st').textContent='🔥 '+streak;
 $('#nx').classList.remove('hide');$('#nb').onclick=next;$('#nb').focus();
}
function next(){i++;i<list.length?show():result()}
function result(){
 const p=score/list.length,pt=(p*10).toFixed(2).replace(/\.?0+$/,'');
 const msg=p>=.9?'Xuất sắc! 🏆':p>=.7?'Khá tốt! 👍':p>=.5?'Cần ôn thêm chút nữa 💪':'Cố gắng lên, ôn lại nhé 📚';
 app.innerHTML=`<div class="bar"><i style="width:100%"></i></div><div class="card"><div class="mut" style="text-align:center">Điểm của bạn</div><div class="big">${pt}/10</div>
 <p style="text-align:center;font-weight:700;font-size:18px">${msg}</p>
 <div class="stats"><span class="pill">✅ Đúng: ${score}</span><span class="pill">❌ Sai: ${wrong.length}</span><span class="pill">📊 ${Math.round(p*100)}%</span></div>
 <div class="row" style="justify-content:center">${wrong.length?'<button class="btn" id="rw">Làm lại câu sai</button>':''}<button class="btn g" id="hm">Về trang chủ</button></div>
 ${wrong.length?'<h3>Các câu làm sai</h3><div class="rv">'+wrong.map(w=>`<div><b>Câu #${w.q.n}: ${w.q.q}</b><br><small>Bạn chọn: ${'ABCD'[w.k]}. ${w.q.o[w.k]}</small><br>✅ ${'ABCD'[w.q.a]}. ${w.q.o[w.q.a]}</div>`).join('')+'</div>':''}</div>`;
 $('#hm').onclick=home;
 if(wrong.length)$('#rw').onclick=()=>{const ids=new Set(wrong.map(w=>w.q.n));start(Q.filter(q=>ids.has(q.n)),999,true,true)};
}
document.addEventListener('keydown',e=>{
 const k='abcd'.indexOf(e.key.toLowerCase());
 if(e.key.length===1&&k>=0&&list&&document.querySelector('.o'))pick(k);
 else if('1234'.includes(e.key)&&e.key.length===1&&document.querySelector('.o'))pick(+e.key-1);
 else if(e.key==='Enter'&&done&&$('#nb'))next();
});
home();
</script></body></html>
